<!DOCTYPE html>
<html lang="fr font-sans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéPoly - Interface Mobile First</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Urbanist', sans-serif; background-color: #0A0A0A; }
    </style>
</head>
<body class="bg-[#0A0A0A] text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#1F1F1F] rounded-3xl p-6 shadow-2xl border border-gray-800 space-y-6">
        
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <div>
                <span class="text-xs text-red-500 font-bold uppercase tracking-widest">PST&B Projet</span>
                <h1 class="text-3xl font-bold tracking-tight">Ciné<span class="text-[#E50914]">Poly</span></h1>
            </div>
            <div class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-semibold">
                ● Utilisateur Connecté
            </div>
        </div>

        <div class="bg-black/40 border border-gray-800 rounded-2xl p-4 flex gap-4">
            <div class="w-16 h-24 bg-gray-800 rounded-lg flex items-center justify-center text-xs text-gray-500 font-bold shadow-inner">POSTER</div>
            <div class="flex flex-col justify-center">
                <h2 class="text-lg font-bold">Inception</h2>
                <p class="text-sm text-gray-400">Christopher Nolan (2010)</p >
                <div class="mt-2 text-[10px] bg-yellow-500/10 border border-yellow-500/20 text-yellow-500 px-2 py-0.5 rounded font-mono w-fit">
                    ID Film SQL : 1
                </div>
            </div>
        </div>

        <div class="space-y-4">
            <h3 class="text-md font-semibold text-gray-300">Rédiger votre critique (Persistance NoSQL)</h3>
            
            <div>
                <label class="block text-xs text-gray-400 mb-1">Note de l'utilisateur (0 à 5)</label>
                <input type="number" id="note" max="5" min="0" step="0.1" value="4.5" class="w-full bg-black/60 border border-gray-800 rounded-xl p-3 text-white focus:border-[#E50914] focus:ring-1 focus:ring-[#E50914] outline-none transition text-sm">
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Titre de l'avis</label>
                <input type="text" id="titre" value="Un chef-d'œuvre de la science-fiction" class="w-full bg-black/60 border border-gray-800 rounded-xl p-3 text-white focus:border-[#E50914] focus:ring-1 focus:ring-[#E50914] outline-none transition text-sm">
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Commentaire détaillé</label>
                <textarea id="texte" rows="3" class="w-full bg-black/60 border border-gray-800 rounded-xl p-3 text-white focus:border-[#E50914] focus:ring-1 focus:ring-[#E50914] outline-none transition text-sm">Le concept des rêves imbriqués et la réalisation technique sont absolument parfaits.</textarea>
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Tags (Modèle flexible MongoDB - Séparer par des virgules)</label>
                <input type="text" id="tags" value="Sci-Fi, Inception, Nolan, Top2010" class="w-full bg-black/60 border border-gray-800 rounded-xl p-3 text-white focus:border-[#E50914] focus:ring-1 focus:ring-[#E50914] outline-none transition text-sm">
            </div>

            <button onclick="soumettreCritique() " class="w-full bg-[#E50914] hover:bg-red-700 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl transition duration-200 text-sm shadow-lg shadow-red-900/20">
                Publier l'avis sur MongoDB
            </button>
        </div>

        <div id="apiResponse" class="hidden p-4 rounded-xl text-xs font-mono border"></div>

    </div>

    <script>
        async function soumettreCritique() {
            const responseBox = document.getElementById('apiResponse');
            
            // Formatage du JSON conforme au modèle Pydantic de main.py
            const payload = {
                film_id: 1, // En lien direct avec l'ID de la base SQL
                note: parseFloat(document.getElementById('note').value),
                titre_critique: document.getElementById('titre').value,
                texte_critique: document.getElementById('texte').value,
                tags: document.getElementById('tags').value.split(',').map(t => t.trim())
            };

            try {
                // Appel AJAX vers l'API locale FastAPI
                const response = await fetch('http://127.0.0.1:8000/films/critiques', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer FORMAL_JWT_TOKEN_SIMULATION' // Transmis à auth.py
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                responseBox.classList.remove('hidden');
                if (response.ok) {
                    // Succès : affichage vert avec l'ID unique généré par MongoDB
                    responseBox.className = "p-4 rounded-xl text-xs font-mono bg-emerald-950/40 border border-emerald-500/30 text-emerald-400 space-y-1";
                    responseBox.innerHTML = `<strong>🟢 SUCCÈS HTTP 201 (Created)</strong><br>• Critique insérée dans MongoDB !<br>• ID Document : <span class="underline">${data.critique_id}</span><br>• Auteur certifié SQL : <b>${data.auteur}</b>`;
                } else {
                    // Erreur métier renvoyée par le Backend
                    responseBox.className = "p-4 rounded-xl text-xs font-mono bg-rose-950/40 border border-rose-500/30 text-rose-400";
                    responseBox.innerHTML = `<strong>🔴 ERREUR BACKEND (HTTP ${response.status})</strong><br>Détail : ${data.detail}`;
                }
            } catch (error) {
                // Cas où le serveur FastAPI n'est pas lancé
                responseBox.classList.remove('hidden');
                responseBox.className = "p-4 rounded-xl text-xs font-mono bg-amber-950/40 border border-amber-500/30 text-amber-400";
                responseBox.innerHTML = `<strong>⚠️ ERREUR DE CONNEXION</strong><br>Le serveur Backend FastAPI n'est pas démarré sur <span class="underline">http://127.0.0.1:8000</span>. Veuillez lancer Uvicorn.`;
            }
        }
    </script>
</body>
</html>
